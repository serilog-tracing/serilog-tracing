name: CI

# Pull requests only: pushes to `dev` and `main` are built, tested, and published by `publish.yml`.
on:
  pull_request:
    branches: [ "dev", "main" ]

env:
  CI_BUILD_NUMBER: ${{ github.run_number }}
  CI_TARGET_BRANCH: ${{ github.head_ref }}

jobs:
  build:

    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
      - name: Setup
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: true
        shell: pwsh
        run: |
          ./Build.ps1
